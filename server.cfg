# realtime-server 설정 파일
# 변경 후 서버 재시작 필요

port = 7777

# 워커 스레드 수 = CPU 코어 수 * worker_thread_multiplier
worker_thread_multiplier = 2

# 게임 틱 간격 (ms) — 33ms ≈ 30Hz
tick_interval_ms = 33

# 이 시간(ms) 동안 패킷이 없으면 세션 강제 종료
heartbeat_timeout_ms = 30000

# 룸당 최대 인원
max_room_players = 16

# 서버 통계 출력 간격 (ms)
stats_print_interval_ms = 10000

# 로그 파일 경로 (비워두면 콘솔만 출력)
log_file =

# session-server 연동 (토큰 검증용 내부망 직접 호출)
session_server_host = 127.0.0.1
session_server_port = 8080

# AuthService 전용 스레드 수 (너무 크면 session-server에 부하)
auth_worker_count = 4

# session-server HTTP 응답 타임아웃 (ms). 초과 시 로그인 실패로 처리
auth_timeout_ms = 3000

# 자가 등록 - 클라이언트에게 노출할 이 서버의 IP
external_host = 127.0.0.1
max_total_players = 500

# 헬스체크 HTTP 서버 포트 (로드밸런서 / 쿠버네티스 readinessProbe 용)
health_server_port = 8081

# 보안 / 패킷 가드
max_packet_size = 4096
packet_rate_limit_per_sec = 100

# 룸 생명주기
idle_room_timeout_ms = 60000
reconnect_window_ms = 30000

# control-plane 연동 (api-gateway를 통해 api-server heartbeat 보고)
api_gateway_host = 127.0.0.1
api_gateway_port = 5000

# 게임서버 관리 화면에서 발급한 API 키를 넣으세요.
game_server_api_key =

# 운영 화면에 표시될 서버 버전 문자열
game_server_version = 0.1.0-local

# heartbeat 보고 주기 / timeout (ms)
heartbeat_report_interval_ms = 10000
control_plane_timeout_ms = 3000
